name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main的CI可能已进入生产发布，不能被新提交中途取消。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 单元/集成测试，包含 tests/post-fields-contract.test.ts（Post 字段 × 客户端契约）
      - run: npx vitest run
      - run: npm run test:integrations
      - run: npm run check

  deploy:
    needs: test
    if: >-
      github.repository == 'KtKID/MadeMe-studio' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/deploy-production.yml
    secrets:
      cloudflare_deploy_token: ${{ secrets.CLOUDFLARE_API_TOKEN_FOR_DEPLOY }}
